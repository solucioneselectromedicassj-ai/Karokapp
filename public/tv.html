<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Karaoke Party - Pantalla</title>
<style>
  html,body { margin:0; height:100%; background:#000; color:#fff; font-family:system-ui,sans-serif; overflow:hidden; }
  #player, #vid { position:absolute; inset:0; width:100%; height:100%; }
  #vid { object-fit:contain; background:#000; display:none; }
  #idle { position:absolute; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center;
          background:linear-gradient(135deg,#1a0b2e,#5a1a6e); text-align:center; padding:4vw; }
  #idle h1 { font-size:max(6vw,28px); margin:0 0 2vw; }
  #idle p { font-size:max(2.4vw,16px); margin:.4em 0; color:#e0cfff; }
  #start { position:absolute; inset:0; z-index:10; background:#1a0b2e; color:#fff; border:0; font-size:max(5vw,24px); cursor:pointer; }
  #bar { position:absolute; left:0; right:0; bottom:0; z-index:8; background:rgba(0,0,0,.65); padding:.8vw 2vw;
         font-size:max(1.8vw,13px); display:flex; justify-content:space-between; opacity:0; transition:opacity .4s; pointer-events:none; }
  #bar.show { opacity:1; }
  #toast { position:absolute; top:2vw; left:50%; transform:translateX(-50%); z-index:9; background:#ff4fa3; padding:1vw 2vw;
           border-radius:2vw; font-size:max(2vw,14px); display:none; max-width:90vw; text-align:center; }
  #cast { position:absolute; top:12px; right:12px; z-index:9; display:none; background:rgba(0,0,0,.6); color:#fff; border:1px solid #ff4fa3;
          border-radius:999px; padding:10px 16px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<button id="start">▶ Toca para iniciar el karaoke</button>
<div id="player"></div>
<video id="vid" playsinline></video>
<div id="idle">
  <h1 id="idleTitle">🎤 ¡Elige tu canción!</h1>
  <p id="idleSub">Conéctate al mismo Wi-Fi y abre en tu teléfono:</p>
  <p><b id="addr"></b></p>
</div>
<button id="cast">📡 Transmitir a la TV</button>
<div id="bar"><span id="now"></span><span id="next"></span></div>
<div id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = id => document.getElementById(id);
$('addr').textContent = location.host;
let player, ytReady = false, started = false, st = { queue: [], current: null }, playing = null;
const vid = $('vid');

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 1, rel: 0, playsinline: 1, controls: 1 },
    events: {
      onReady: () => { ytReady = true; sync(); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) next(); },
      onError: () => { toast('Ese video no permite reproducirse aquí. Pasando a la siguiente…'); setTimeout(next, 1800); }
    }
  });
}
function next() { if (playing != null) fetch('/api/next', { method: 'POST', body: JSON.stringify({ qid: playing }) }); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500); }
function showBar(cur) {
  $('now').textContent = `🎤 ${cur.singer} — ${cur.title}`;
  $('bar').classList.add('show'); setTimeout(() => $('bar').classList.remove('show'), 8000);
}

// ---- Transmitir a la TV (Chromecast / AirPlay) ----
const canCast = 'remote' in vid || typeof vid.webkitShowPlaybackTargetPicker === 'function';
$('cast').onclick = () => {
  if ('remote' in vid) vid.remote.prompt().catch(e => toast(e.name === 'NotFoundError' ? 'No encontré TVs. ¿Están en el mismo Wi-Fi?' : 'No se pudo transmitir'));
  else vid.webkitShowPlaybackTargetPicker();
};

function stopAll() {
  vid.pause(); vid.removeAttribute('src'); vid.load();
  if (ytReady) try { player.stopVideo(); } catch {}
}

function sync() {
  if (!started) return;
  const cur = st.queue.find(s => s.qid === st.current);
  const waiting = !cur && st.queue.length;
  const local = cur && cur.kind === 'local';
  $('idle').style.display = !cur ? 'flex' : 'none';
  $('idleTitle').textContent = waiting ? '⏳ Preparando tu canción…' : '🎤 ¡Elige tu canción!';
  $('idleSub').style.display = waiting ? 'none' : '';
  vid.style.display = local ? 'block' : 'none';
  $('player').style.visibility = cur && cur.kind === 'yt' ? 'visible' : 'hidden';
  $('cast').style.display = local && canCast ? 'block' : 'none';

  if (!cur) { if (playing != null) { playing = null; stopAll(); $('bar').classList.remove('show'); } return; }
  const nxt = st.queue.find(s => s.qid !== cur.qid && (s.kind === 'yt' || s.status === 'ready')) || st.queue.find(s => s.qid !== cur.qid);
  $('next').textContent = nxt ? `Sigue: ${nxt.singer}` : '';
  if (cur.qid === playing) return;
  if (cur.kind === 'yt' && !ytReady) return;   // se reintenta en onReady

  stopAll();
  playing = cur.qid;
  showBar(cur);
  if (cur.kind === 'yt') player.loadVideoById(cur.id);
  else {
    vid.src = `/media/${cur.lid}/karaoke.mp4`;
    vid.onended = next;
    vid.onerror = () => { toast('No se pudo reproducir esa canción. Pasando a la siguiente…'); setTimeout(next, 1800); };
    vid.play().catch(() => toast('Toca la pantalla para activar el sonido'));
  }
}

$('start').onclick = () => { started = true; $('start').style.display = 'none'; sync(); };
vid.onclick = () => { vid.paused ? vid.play() : vid.pause(); };
const es = new EventSource('/events');
es.onmessage = e => { st = JSON.parse(e.data); sync(); };
</script>
</body>
</html>
